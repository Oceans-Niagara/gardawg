name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.variant }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        variant: [headless, gui]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x86_64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64
            ext: ".exe"
          - variant: headless
            tag: ""
            features: ""
          - variant: gui
            tag: "-gui"
            features: "--features gui"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux' && matrix.variant == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gardawg${{ matrix.ext }}" \
             "dist/gardawg${{ matrix.tag }}-${{ matrix.suffix }}${{ matrix.ext }}"

      - name: Sign Windows binary (when WINDOWS_PFX_BASE64 secret is configured)
        if: runner.os == 'Windows' && env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on Windows runner" }
          $exe = "dist/gardawg${{ matrix.tag }}-${{ matrix.suffix }}${{ matrix.ext }}"
          & $signtool.FullName sign /f $pfxPath /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr http://digicert.com /td SHA256 $exe
          Remove-Item -Force $pfxPath

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
